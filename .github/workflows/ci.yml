name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Matches package.json engines. The .ts sources need unflagged type stripping, so 24 is
        # the floor as well as the development version.
        node: ['24']
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Smoke import
        run: node -e "import('./index.ts').then(m => { if (typeof m.default !== 'function') process.exit(1); console.log('ok', Object.keys(m).join(',')) })"

  types:
    name: lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: ESLint
        run: npm run lint
      # Checks the .ts sources against both @types/node and @cloudflare/workers-types, so the
      # Web Crypto surfaces are typed the way workerd declares them.
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Strict-TS validation of index.d.ts
        run: npm run test:types
