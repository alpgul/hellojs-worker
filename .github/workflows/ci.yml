name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    # npm test boots workerd for the workers project, and the Workers pool image is a
    # download the first run pays for.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Matches package.json engines. Node 24.7 is the floor for native ML-KEM-768 WebCrypto
        # (the default Chrome 147 key share); 24 is also the floor for unflagged type stripping.
        node: ['24']
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - name: Unit tests
        run: npm test
      - name: Smoke import
        run: node -e "import('./index.ts').then(m => { if (typeof m.default !== 'function') process.exit(1); console.log('ok', Object.keys(m).join(',')) })"

  types:
    name: lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - name: ESLint
        run: npm run lint
      # Checks the .ts sources against both @types/node and @cloudflare/workers-types, so the
      # Web Crypto surfaces are typed the way workerd declares them.
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Strict-TS validation of index.d.ts
        run: npm run test:types

  bench:
    name: local benchmark
    runs-on: ubuntu-latest
    # The soak runs inside `npm test` (it asserts, so it gates); the benchmark only has to
    # prove every client completes against the local h2 server. Timings are informational
    # and are not compared between runs.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - name: Cross-client benchmark (loopback only)
        run: npm run bench
